worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream backend_upstream {
        server backend:8080;
    }

    upstream phpmyadmin_upstream {
        server phpmyadmin:80;
    }

    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /media/ {
            proxy_pass http://backend_upstream/media/;
            proxy_set_header Host $host;
        }

        location /healthz {
            proxy_pass http://backend_upstream/healthz;
        }

        # phpMyAdmin is an infrastructure tool, not a customer-facing route —
        # keep it under a distinct path and restrict access at the network/firewall level.
        location /phpmyadmin/ {
            proxy_pass http://phpmyadmin_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
